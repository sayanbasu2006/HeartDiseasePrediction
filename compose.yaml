services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:////state/history.sqlite
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    volumes:
      - cardiolens-history:/state
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
volumes:
  cardiolens-history:
